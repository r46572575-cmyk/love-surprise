<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сюрприз для тебе 💗</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#ffdce8,#fff0f5);font-family:Arial,sans-serif;color:#7b294d;padding:18px;box-sizing:border-box}.card{max-width:440px;width:100%;padding:26px 18px;background:#fff9fc;border-radius:25px;text-align:center;box-shadow:0 10px 35px #b44c7425;box-sizing:border-box}h1{font-size:30px}.heart{font-size:48px}button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:13px;background:#ffdfeb;color:#782749;font-size:16px;font-weight:bold}#msg{min-height:25px}.hidden{display:none}
</style>
</head>
<body><main class="card"><div class="heart">💗</div><h1>Маленька загадка</h1><p>Відгадай три загадки й відкрий сюрприз ✨</p><h3 id="num">Загадка 1 із 3</h3><p id="q">Що стає теплішим, коли ти усміхаєшся?</p><div id="answers"></div><p id="msg"></p><section id="end" class="hidden"><div class="heart">💖</div><h1>Ти особлива!</h1><p>Я дуже радий, що ти є в моєму житті 🫶</p><p>Нехай у тебе завжди буде причина усміхатися. Це маленький сюрприз тільки для тебе 💕</p><button onclick="hearts()">Ще сердечок 💞</button></section></main>
<script>
const data=[{q:"Що стає теплішим, коли ти усміхаєшся?",a:["Моє серденько 💗","Сніг","Лід"],c:0},{q:"Що можна подарувати без коробки?",a:["Камінь","Усмішку 😊","Олівець"],c:1},{q:"Ти для мене…",a:["Байдужа","Особлива 💖","Просто знайома"],c:1}];let n=0;function draw(){document.getElementById('num').textContent='Загадка '+(n+1)+' із 3';document.getElementById('q').textContent=data[n].q;let box=document.getElementById('answers');box.innerHTML='';document.getElementById('msg').textContent='';data[n].a.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(i!==data[n].c){document.getElementById('msg').textContent='Спробуй ще раз 💕';return}if(n<2){n++;draw()}else{document.getElementById('num').classList.add('hidden');document.getElementById('q').classList.add('hidden');box.classList.add('hidden');document.getElementById('msg').classList.add('hidden');document.getElementById('end').classList.remove('hidden');hearts()}};box.appendChild(b)})}function hearts(){for(let i=0;i<16;i++){let e=document.createElement('div');e.textContent=['💗','💖','💕','✨'][Math.floor(Math.random()*4)];e.style.cssText='position:fixed;left:'+Math.random()*95+'vw;top:'+Math.random()*90+'vh;font-size:28px;pointer-events:none';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}}draw();
</script></body></html>
